name: Validate logos
on:
  pull_request:
    paths: ['logos/**', 'scripts/**', 'aliases.json']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-index.js --check
